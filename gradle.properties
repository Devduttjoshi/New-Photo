# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process with headless mode for CI/CD runners.
org.gradle.jvmargs=-Xmx2048m -Djava.awt.headless=true -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
org.gradle.parallel=true

# Kotlin code style for this project:
kotlin.code.style=official

# AndroidX and Jetifier support for modern and legacy libraries
android.useAndroidX=true
android.enableJetifier=true

# Namespacing of each library's R class
android.nonTransitiveRClass=true

# Build cache and configuration cache
org.gradle.caching=true
org.gradle.configuration-cache=true

# Concurrency limits
org.gradle.workers.max=4

# In-process execution strategy for Kotlin compiler and KSP to prevent daemon disconnects in headless containers
kotlin.compiler.execution.strategy=in-process
ksp.run.in.process=true

# Allow google-services plugin without missing file failure
googleServices.missing.passthrough=true
