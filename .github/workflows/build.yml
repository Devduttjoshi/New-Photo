name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Mock google-services.json if missing
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123456789012","project_id":"photo-viewer","storage_bucket":"photo-viewer.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef","android_client_info":{"package_name":"com.example"}},"oauth_client":[],"api_key":[{"current_key":"fake_key"}],"services":{"analytics_service":{"status":1}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace -Dksp.run.in.process=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photo-viewer-debug
          path: app/build/outputs/apk/debug/*.apk
